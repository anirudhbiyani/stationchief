title: AI agent read a credential file
id: c41d8f76-2e35-4b0a-9d52-7a1f3c6e8b94
name: stationchief_agent_credential_read
status: experimental
description: >
  A file read touched a credential path. On its own this is routine; it is the
  first half of the read-then-network correlation below.
references:
  - https://schema.ocsf.io/1.9.0/classes/file_activity
logsource:
  product: ocsf
  service: stationchief
detection:
  credential_read:
    class_uid: 1001
    activity_id: 2
    file.path|contains:
      - '.aws/credentials'
      - '.ssh/id_'
      - '.netrc'
      - '.env'
      - 'kube/config'
  condition: credential_read
fields:
  - metadata.correlation_uid
  - file.path
falsepositives:
  - Any work that legitimately reads these files.
level: informational
---
title: AI agent made an outbound HTTP request
id: a9a4ef65-fccb-4a98-8a39-b31a01e40453
name: stationchief_agent_outbound_http
status: experimental
description: >
  An agent tool made an HTTP request. The second half of the read-then-network
  correlation below.
references:
  - https://schema.ocsf.io/1.9.0/classes/http_activity
logsource:
  product: ocsf
  service: stationchief
detection:
  outbound:
    class_uid: 4002
  condition: outbound
fields:
  - metadata.correlation_uid
  - http_request.url.hostname
falsepositives:
  - Documentation lookups and every other ordinary web fetch.
level: informational
---
title: AI agent read credentials then reached the network
id: 5d2a9b18-7c64-43e1-a0f9-8b3e1d5c7a06
status: experimental
description: >
  Within one agent session, a file read touched a credential path and an HTTP
  request followed within five minutes. Exfiltration and benign deploy tooling
  share this shape, so this is a lead, not a verdict.
correlation:
  type: temporal_ordered
  rules:
    - stationchief_agent_credential_read
    - stationchief_agent_outbound_http
  group-by:
    - metadata.correlation_uid
  timespan: 5m
falsepositives:
  - Deployment and infrastructure work, which legitimately does exactly this.
level: high
